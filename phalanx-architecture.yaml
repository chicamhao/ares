# pi.dev agent architecture — phalanx model
# read order: roles -> rules -> models -> extend
schema_version: 1

roles:
  strategos:
    tier: command
    count: 1
    reports_to: null
    dispatches: [lochagos, psiloi]
    interfaces: [chat, note]     # user-facing surfaces; both follow rule concise_output
    responsibility: sets the objective and owns final decisions; acts directly on small or single-file work, and dispatches a lochagos only for large, multi-file, risky, or genuinely parallel work

  psiloi:
    tier: scout
    count: variable
    reports_to: strategos
    writes_to: [agora]
    responsibility: fast, cheap recon when the target location is unknown

  lochagos:
    tier: coordinator
    count: one per domain
    reports_to: strategos
    responsibility: breaks the objective into tasks for one domain and carries them out directly
    instances:
      - work        # generalist: investigate + implement + verify in one pass — default for small/medium tasks
      - research
      - build
      - verify

  agora:
    tier: infrastructure
    accessed_by: [strategos, lochagos, psiloi]
    responsibility: shared memory and message bus; the only place state lives

  oracle:
    tier: escalation
    count: 1
    reports_to: null            # outside the chain of command — this is the user
    consulted_by: [strategos]   # only the strategos may ask; keeps interruptions rare
    responsibility: resolves what the system cannot — ambiguity or exhausted retries

interfaces:
  chat: {}
  note:
    tool: obsidian_note
    path: <set this — e.g. "Vault/pi/strategos.md">
    responsibility: strategos reads objectives from and writes reports to this file

deployment:
  game_dev_solo:
    code:
      tool: filesystem
      scope: Scripts/
      constraint: read and write restricted to this path only
    data:
      tool: unity_mcp
      constraint: all engine, scene, and asset operations go through unity-mcp only

rules:
  - id: chain_of_command
    statement: a lochagos escalates failure to the strategos, never sideways to another lochagos

  - id: scout_first
    statement: probe with psiloi when the target location is unknown; skip it when you already know where to act

  - id: shield_wall
    statement: on failure, retry at the narrowest scope once; if an escalation model is configured, retry once more on that model; then escalate up — never retry the same scope twice on the same model

  - id: consult_the_oracle
    statement: if the objective is ambiguous, or a shield_wall escalation reaches the strategos with nothing new to try, stop and ask the user — do not re-dispatch

  - id: single_state
    statement: no agent holds private state; all reads and writes go through agora — request only the keys a task needs, not the whole store

  - id: concise_output
    statement: user-facing output is extremely concise — no preamble, no narration, no restating the question; skip anything not essential to the answer

models:
  # optional: a stronger/pricier model for shield_wall's last retry before the
  # oracle is consulted, e.g. "anthropic/claude-opus-4". Leave blank to skip
  # straight to the oracle once the primary model's retries are exhausted.
  escalation: ""

extend:
  general_principle: extending the phalanx means editing this file (add a lochagos instance, write a matching .pi/agents/lochagos-<domain>.md) and updating the README — there is no auto-extend command
